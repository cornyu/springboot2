server.port=8989
spring.application.name=sp_demo

# MySQL 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3307/demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.type-aliases-package=com.springboot.demo.entity
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.use-column-label=true
mybatis.configuration.cache-enabled=false

# 打印SQL日志
logging.level.com.springboot.demo.mapper=DEBUG

# 开发模式禁用静态资源缓存（避免浏览器缓存旧版前端文件）
spring.resources.cache.period=0