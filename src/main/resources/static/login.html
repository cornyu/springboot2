<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数据库数据浏览器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            width: 400px; background: #fff; border-radius: 8px;
            padding: 40px 36px 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .login-title { font-size: 20px; font-weight: 600; color: #303133; text-align: center; }
        .login-subtitle { font-size: 13px; color: #909399; text-align: center; margin: 8px 0 28px; }
        .form-item { margin-bottom: 20px; }
        .form-item label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; }
        .login-input {
            width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
            border: 1px solid #dcdfe6; border-radius: 4px; outline: none;
            transition: border-color .2s;
        }
        .login-input:focus { border-color: #409eff; }
        .login-btn {
            width: 100%; height: 42px; margin-top: 8px;
            background: #409eff; color: #fff; font-size: 15px; border: none;
            border-radius: 4px; cursor: pointer; transition: background .2s;
        }
        .login-btn:hover { background: #66b1ff; }
        .msg {
            padding: 10px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 16px;
        }
        .msg-error { background: #fef0f0; color: #f56c6c; border: 1px solid #fbc4c4; }
        .msg-info { background: #f0f9eb; color: #67c23a; border: 1px solid #c2e7b0; }
        .tip { text-align: center; font-size: 12px; color: #c0c4cc; margin-top: 16px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-title">数据库数据浏览器</div>
    <div class="login-subtitle">请登录后使用</div>

    <div id="errorMsg" class="msg msg-error hidden">用户名或密码错误</div>
    <div id="logoutMsg" class="msg msg-info hidden">您已退出登录</div>

    <form action="/login" method="POST">
        <div class="form-item">
            <label>用户名</label>
            <input type="text" name="username" class="login-input" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" name="password" class="login-input" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="login-btn">登 录</button>
    </form>

    <div class="tip">默认账号：admin / 123456</div>
</div>

<script>
    var params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
        document.getElementById('errorMsg').classList.remove('hidden');
    }
    if (params.get('logout')) {
        document.getElementById('logoutMsg').classList.remove('hidden');
    }
</script>
</body>
</html>
